        <!-- Custom Style System -->
        <style>
        /* =================================================================
           1. CSS VARIABLES & SYSTEM DESIGN
           ================================================================= */
        :root {
            --bg-main: #050816;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #5B8CFF;
            --secondary: #6EE7F9;
            --accent: #9F7AEA;
            --text-main: #FFFFFF;
            --text-sub: #B8C0D6;
            --glass-glow: rgba(91, 140, 255, 0.25);
            --font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Reset & Base Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* =================================================================
           2. BACKGROUND & AMBIENT GLOW EFFECTS
           ================================================================= */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }

        .ambient-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
        }

        .ambient-2 {
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
        }

        .ambient-3 {
            top: 40%;
            left: 30%;
            width: 35vw;
            height: 35vw;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            opacity: 0.25;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
            100% { transform: scale(1.15) translate(20px, -20px); opacity: 0.55; }
        }

        /* Custom Interactive Cursor Glow */
        .cursor-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(110, 231, 249, 0.15) 0%, rgba(91, 140, 255, 0.05) 50%, transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: transform 0.08s ease-out;
            mix-blend-mode: screen;
        }

        /* =================================================================
           3. MAIN LAYOUT & GLASS CONTAINER
           ================================================================= */
        .viewport-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            padding: 2rem 1rem;
        }

        .hero-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 3.5rem 2.5rem;
            max-width: 780px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.03),
                transparent
            );
            transform: skewX(-25deg);
            transition: 0.75s;
            pointer-events: none;
        }

        .hero-card:hover::before {
            left: 100%;
        }

        /* =================================================================
           4. PROFILE IMAGE & ANIMATED BORDER RING
           ================================================================= */
        .profile-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 2.2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Outer Rotating Gradient Ring */
        .profile-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            animation: spinRing 8s linear infinite;
            filter: drop-shadow(0 0 15px var(--glass-glow));
        }

        .profile-ring-blur {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            animation: spinRing 8s linear infinite;
            filter: blur(20px);
            opacity: 0.6;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-avatar-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background-color: #0d1117;
            border: 4px solid var(--bg-main);
            z-index: 2;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease, filter 0.6s ease;
        }

        .profile-container:hover .profile-avatar-wrap {
            transform: scale(1.05);
        }

        .profile-container:hover .profile-avatar {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .profile-container:hover .profile-ring {
            animation-duration: 4s;
            filter: drop-shadow(0 0 25px rgba(110, 231, 249, 0.8));
        }

        /* =================================================================
           5. TYPOGRAPHY & GRADIENT TEXT
           ================================================================= */
        .profile-name {
            font-size: 3.25rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #FFFFFF 30%, var(--secondary) 70%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.15;
        }

        .typing-wrapper {
            font-size: 1.35rem;
            font-weight: 500;
            color: var(--secondary);
            margin-bottom: 1.25rem;
            min-height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .typing-prefix {
            color: var(--text-sub);
            font-weight: 400;
        }

        .typed-cursor {
            color: var(--secondary);
            font-size: 1.4rem;
        }

        .profile-bio {
            font-size: 1rem;
            color: var(--text-sub);
            line-height: 1.7;
            max-width: 620px;
            margin: 0 auto 2.2rem auto;
            font-weight: 300;
        }

        /* =================================================================
           6. SOCIAL MEDIA BUTTONS
           ================================================================= */
        .social-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.85rem;
            flex-wrap: wrap;
            margin-bottom: 2.2rem;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .social-btn:hover {
            color: #FFFFFF;
            background: var(--primary);
            border-color: var(--secondary);
            transform: translateY(-6px) scale(1.1) rotate(6deg);
            box-shadow: 0 10px 20px rgba(91, 140, 255, 0.4);
        }

        .social-btn:focus-visible {
            outline: 2px solid var(--secondary);
            outline-offset: 4px;
        }

        /* Individual Hover Branding Colors */
        .social-btn.github:hover { background: #333333; border-color: #555; }
        .social-btn.linkedin:hover { background: #0A66C2; border-color: #388bfd; }
        .social-btn.instagram:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border-color: #f09433; }
        .social-btn.facebook:hover { background: #1877F2; border-color: #4294ff; }
        .social-btn.youtube:hover { background: #FF0000; border-color: #ff4d4d; }
        .social-btn.tiktok:hover { background: #000000; border-color: #25F4EE; color: #25F4EE; }
        .social-btn.whatsapp:hover { background: #25D366; border-color: #4cdb82; }
        .social-btn.telegram:hover { background: #229ED9; border-color: #53beee; }

        /* =================================================================
           7. CALL TO ACTION BUTTONS
           ================================================================= */
        .action-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .btn-custom {
            padding: 0.85rem 2.25rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            border: none;
            cursor: pointer;
            z-index: 1;
        }

        .btn-primary-glow {
            background: linear-gradient(135deg, var(--primary), #3b71fe);
            color: #FFFFFF;
            box-shadow: 0 10px 25px rgba(91, 140, 255, 0.35);
        }

        .btn-primary-glow::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            opacity: 0;
            z-index: -1;
            transition: opacity 0.4s ease;
        }

        .btn-primary-glow:hover {
            color: #FFFFFF;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 35px rgba(110, 231, 249, 0.5);
        }

        .btn-primary-glow:hover::before {
            opacity: 1;
        }

        .btn-secondary-glass {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .btn-secondary-glass:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--secondary);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
        }

        .btn-custom:focus-visible {
            outline: 2px solid var(--secondary);
            outline-offset: 4px;
        }

        /* =================================================================
           8. RESPONSIVE BREAKPOINTS
           ================================================================= */
        @media (max-width: 768px) {
            .hero-card {
                padding: 2.5rem 1.5rem;
                border-radius: 24px;
            }

            .profile-container {
                width: 180px;
                height: 180px;
                margin-bottom: 1.8rem;
            }

            .profile-name {
                font-size: 2.35rem;
            }

            .typing-wrapper {
                font-size: 1.15rem;
            }

            .profile-bio {
                font-size: 0.92rem;
                padding: 0 0.5rem;
            }

            .social-btn {
                width: 42px;
                height: 42px;
                font-size: 1.1rem;
            }

            .action-group {
                flex-direction: column;
                width: 100%;
                gap: 0.8rem;
            }

            .btn-custom {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .profile-name {
                font-size: 1.95rem;
            }
            
            .social-group {
                gap: 0.5rem;
            }
        }
    </style>
    </head>

            src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

            src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

        <!-- AOS (Animate On Scroll) JS -->

        <!-- Custom Interactivity Logic -->
        <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* =============================================================
               1. INITIALIZE AOS ANIMATION
               ============================================================= */
            AOS.init({
                once: true,
                easing: 'ease-out-cubic',
                duration: 1000
            });

            /* =============================================================
               2. INITIALIZE TYPED.JS TEXT ANIMATION
               ============================================================= */
            const typed = new Typed('#typed-target', {
                strings: [
                    'Web Developer',
                    'UI/UX Designer',
                    'Software Engineer',
                    'Content Creator',
                    'AI Enthusiast',
                    'Islamic Educator'
                ],
                typeSpeed: 60,
                backSpeed: 40,
                backDelay: 2000,
                loop: true,
                showCursor: true,
                cursorChar: '|'
            });

            /* =============================================================
               3. PARTICLES.JS BACKGROUND CONFIGURATION
               ============================================================= */
            particlesJS('particles-js', {
                "particles": {
                    "number": {
                        "value": 45,
                        "density": {
                            "enable": true,
                            "value_area": 800
                        }
                    },
                    "color": {
                        "value": ["#5B8CFF", "#6EE7F9", "#9F7AEA"]
                    },
                    "shape": {
                        "type": "circle"
                    },
                    "opacity": {
                        "value": 0.35,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 1,
                            "opacity_min": 0.1,
                            "sync": false
                        }
                    },
                    "size": {
                        "value": 3,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 2,
                            "size_min": 0.5,
                            "sync": false
                        }
                    },
                    "line_linked": {
                        "enable": true,
                        "distance": 140,
                        "color": "#5B8CFF",
                        "opacity": 0.15,
                        "width": 1
                    },
                    "move": {
                        "enable": true,
                        "speed": 1.2,
                        "direction": "none",
                        "random": true,
                        "straight": false,
                        "out_mode": "out",
                        "bounce": false
                    }
                },
                "interactivity": {
                    "detect_on": "window",
                    "events": {
                        "onhover": {
                            "enable": true,
                            "mode": "grab"
                        },
                        "onclick": {
                            "enable": true,
                            "mode": "push"
                        },
                        "resize": true
                    },
                    "modes": {
                        "grab": {
                            "distance": 160,
                            "line_linked": {
                                "opacity": 0.35
                            }
                        },
                        "push": {
                            "particles_nb": 3
                        }
                    }
                },
                "retina_detect": true
            });

            /* =============================================================
               4. MOUSE CURSOR GLOW & PARALLAX TRACKING
               ============================================================= */
            const cursorGlow = document.getElementById('cursorGlow');
            let mouseX = 0, mouseY = 0;
            let currentX = 0, currentY = 0;

            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function renderCursor() {
                // Smooth interpolation (lerp) for cursor glow
                currentX += (mouseX - currentX) * 0.1;
                currentY += (mouseY - currentY) * 0.1;
                
                if (cursorGlow) {
                    cursorGlow.style.left = `${currentX}px`;
                    cursorGlow.style.top = `${currentY}px`;
                }

                requestAnimationFrame(renderCursor);
            }
            renderCursor();

            /* =============================================================
               5. MAGNETIC BUTTON EFFECT WITH GSAP
               ============================================================= */
            const magneticButtons = document.querySelectorAll('.social-btn, .btn-custom');

            magneticButtons.forEach(btn => {
                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;

                    gsap.to(btn, {
                        x: x * 0.3,
                        y: y * 0.3,
                        duration: 0.3,
                        ease: 'power2.out'
                    });
                });

                btn.addEventListener('mouseleave', () => {
                    gsap.to(btn, {
                        x: 0,
                        y: 0,
                        duration: 0.5,
                        ease: 'elastic.out(1, 0.4)'
                    });
                });
            });

            /* =============================================================
               6. DOWNLOAD CV BUTTON INTERACTION
               ============================================================= */
            const btnDownloadCv = document.getElementById('btnDownloadCv');
            if (btnDownloadCv) {
                btnDownloadCv.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    // Umpan balik visual klik
                    gsap.to(btnDownloadCv, {
                        scale: 0.95,
                        duration: 0.1,
                        yoyo: true,
                        repeat: 1
                    });

                    // Simulasi pengunduhan file
                    alert('Memulai pengunduhan CV...');
                });
            }
        });
    </script>
    </body>
</html>
