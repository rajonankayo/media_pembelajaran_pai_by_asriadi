<!DOCTYPE html>

            theme: {
                extend: {
                    colors: {
                        'primary-custom': '#4f46e5',
                        'primary-hover-custom': '#4338ca',
                        'text-main-custom': '#d5ff18',
                        'text-muted-custom': '#f6f7f8',
                        'card-bg-custom': '#0804d4',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-text-main-custom flex items-center justify-center min-h-screen p-5 font-sans">

    <div class="max-w-[550px] w-full bg-teal-600 p-8 sm:p-10 rounded-2xl shadow-xl text-center animate-[fadeIn_0.6s_ease-out]">
        <!-- Bagian Icon -->
        <div class="w-20 h-20 bg-[#eeebff] rounded-full flex items-center justify-center mx-auto mb-6 text-primary-custom">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10">

            Next Update
        </span>

        <!-- Teks Informasi -->
        <h1 class="text-2xl sm:text-3xl font-bold mb-3 text-text-main-custom">
            Fitur Keren Sedang Disiapkan!
        </h1>
        <p class="text-base text-text-muted-custom leading-relaxed mb-7">
            Kami sedang bekerja keras untuk menghadirkan fitur ini pada pembaruan sistem selanjutnya demi memberikan pengalaman yang lebih baik untuk Anda. Pantau terus!
